<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of Tomorrow — Milestone C: Content-Ready Pipeline</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #canvasContainer { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

        /* Crosshair for First-Person Gameplay */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; background: rgba(0, 255, 204, 0.85); border-radius: 50%;
            display: none; z-index: 10; pointer-events: none; mix-blend-mode: screen;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
        }

        /* HUD Diagnostics */
        #hudOverlay {
            position: absolute; top: 15px; left: 20px; z-index: 15;
            color: #00ffcc; font-size: 13px; letter-spacing: 1px;
            display: none; text-shadow: 0 0 5px rgba(0,255,204,0.4);
            pointer-events: none;
        }

        #hudInstructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 12px; letter-spacing: 2px;
            text-transform: uppercase; z-index: 15; display: none; pointer-events: none;
        }

        /* Cinematic UI Animations */
        @keyframes fadeIn {
            from { opacity: 0; filter: blur(8px); transform: translateY(8px); }
            to { opacity: 1; filter: blur(0px); transform: translateY(0); }
        }

        #uiLayer {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; z-index: 20; text-align: center; width: 100%;
        }

        h1 {
            font-size: 3.5rem; letter-spacing: 12px; font-weight: normal; margin-bottom: 5px;
            opacity: 0; animation: fadeIn 2s ease-out forwards; animation-delay: 0.2s;
        }

        h2 {
            font-size: 1rem; letter-spacing: 5px; color: #88a; font-weight: normal;
            opacity: 0; animation: fadeIn 2s ease-out forwards; animation-delay: 0.6s;
        }

        .button-container {
            margin-top: 40px; opacity: 0; animation: fadeIn 2s ease-out forwards; animation-delay: 1s;
            display: flex; gap: 20px; justify-content: center;
        }

        button {
            padding: 16px 36px; font-size: 14px; cursor: pointer; letter-spacing: 2px;
            background: rgba(10, 15, 30, 0.7); color: #00ffcc; border: 1px solid #00ffcc;
            transition: all 0.3s; font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase; backdrop-filter: blur(5px);
        }

        button:hover {
            background: #00ffcc; color: #050505;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
        }
    </style>

    <!-- ES Module Import Map for Three.js -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
      }
    }
    </script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hudOverlay">
        <div>ECHO ENGINE // MILESTONE C: CONTENT-READY PIPELINE</div>
        <div id="hudFps">FPS: --</div>
        <div id="hudCoords">POS: (0, 0, 0)</div>
    </div>
    <div id="hudInstructions">
        [WASD] Move | [Shift] Sprint | [E] Interact | [F5] Save | [F9] Load | [P] Menu | [~] Dev Tools
    </div>

    <div id="uiLayer">
        <h1>ECHOES OF TOMORROW</h1>
        <h2>Milestone C: Content-Ready Pipeline (HAOS & Level Pipeline)</h2>
        <div class="button-container">
            <button id="startEngineBtn">ENGAGE RUNTIME</button>
        </div>
    </div>

    <div id="canvasContainer"></div>

    <script type="module">
        import { Bootstrap } from './src/framework/core/Bootstrap.js';

        let engineStarted = false;

        async function launchEngine() {
            if (engineStarted) return;
            engineStarted = true;

            const uiLayer = document.getElementById('uiLayer');
            const crosshair = document.getElementById('crosshair');
            const hudOverlay = document.getElementById('hudOverlay');
            const hudInstructions = document.getElementById('hudInstructions');
            const hudCoords = document.getElementById('hudCoords');
            const hudFps = document.getElementById('hudFps');

            uiLayer.style.display = 'none';
            crosshair.style.display = 'block';
            hudOverlay.style.display = 'block';
            hudInstructions.style.display = 'block';

            try {
                await Bootstrap.start();

                // Periodic HUD Telemetry Update
                setInterval(() => {
                    const input = window.__framework?.serviceRegistry?.get('input');
                    const player = window.__framework?.serviceRegistry?.get('player');
                    const diag = window.__framework?.diagnostics;

                    if (player && hudCoords) {
                        const pos = player.getPlayerPosition();
                        if (pos) {
                            hudCoords.textContent = `POS: (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})`;
                        }
                    }
                    if (diag && hudFps) {
                        hudFps.textContent = `FPS: ${diag.counters?.fps ?? '--'}`;
                    }
                }, 100);

                // Request pointer lock on canvas click
                document.body.addEventListener('click', () => {
                    const inputService = window.__framework?.serviceRegistry?.get('input');
                    if (inputService) {
                        inputService.requestPointerLock(document.body);
                    }
                });
            } catch (err) {
                console.error('[Echoes of Tomorrow] Engine initialization failed:', err);
                alert('Engine failed to initialize. Check console for details.');
            }
        }

        document.getElementById('startEngineBtn')?.addEventListener('click', launchEngine);
    </script>
</body>
</html>
